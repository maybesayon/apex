[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    live: hits real market-data APIs; excluded from the default run because
          results move with the market and CI has no network guarantee.
          Run explicitly with: pytest -m live
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
